<div>
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold">Employee List</h2>
    <button
      type="button"
      class="rounded-md bg-red-600 px-3 py-1 text-sm text-white hover:bg-red-700"
      (click)="fireAll()"
    >
      Zwolnij wszystkich
    </button>
  </div>
  <div class="mt-4 space-y-4">
    @for (employee of employees$ | async; track employee.id) {
    <div class="border border-gray-300 rounded-md p-2 space-y-2">
      <h3 class="text-lg font-bold">
        <a [routerLink]="['/employees', employee.id]"
          >{{ employee.firstName }} {{ employee.lastName }}</a
        >
      </h3>
      <p class="text-sm text-gray-500">{{ employee.salary }} zł</p>
      <div class="flex gap-2">
        <button
          type="button"
          class="rounded-md bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700"
          (click)="select(employee.id)"
        >
          Pokaż w shellu
        </button>
        <button
          type="button"
          class="rounded-md border border-red-500 px-3 py-1 text-sm text-red-600 hover:bg-red-50"
          (click)="remove(employee.id)"
        >
          Zwolnij
        </button>
      </div>
    </div>
    }
  </div>
</div>
