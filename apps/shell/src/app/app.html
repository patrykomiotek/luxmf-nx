<div class="session-bar flex items-center gap-2 p-2">
  @if (user()) {
  <span>Zalogowano jako <strong>{{ user() }}</strong></span>
  <button class="text-blue-500" (click)="signOut()">Wyloguj</button>
  } @else {
  <input
    #login
    class="border border-gray-300 rounded px-2 py-1"
    placeholder="login"
    (keyup.enter)="signIn(login.value); login.value=''"
  />
  <button class="text-blue-500" (click)="signIn(login.value); login.value=''">
    Zaloguj
  </button>
  } @if (sessionMessage()) {
  <span class="text-red-600">{{ sessionMessage() }}</span>
  }
</div>

<tim-button label="Click me"></tim-button>
